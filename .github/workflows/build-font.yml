name: Build and Validate RC

on:
  # Manual runs preserve validated RC artifacts without release creation.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Keep the runner image fixed: system tool versions are checked exactly.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read runtime versions from the shared lock
        id: toolchain
        run: |
          python3 - <<'PY'
          import json, os
          with open("tools/toolchain.lock.json") as source:
              lock = json.load(source)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"node={lock['node']}", file=output)
              print(f"python={lock['python_minor']}", file=output)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.toolchain.outputs.python }}
      - name: Install system dependencies
        timeout-minutes: 12
        shell: bash
        run: |
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              sleep 5
            done
            return 1
          }
          retry sudo apt-get update
          retry sudo apt-get install -y ttfautohint fontforge fontconfig
      - name: Install pinned validation tools
        run: python -m pip install -r tools/requirements.txt
      - name: Check current site web assets
        run: python tools/validate_fonts.py site
      - name: Test validation guards
        run: python -m unittest discover -s tests -v
      - name: Build, patch, package and validate using canonical local operations
        run: python tools/build.py all --work-dir .ci-build --jobs 2
      - name: Preserve validated manual RC artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ioskeley-rc-${{ github.sha }}
          path: |
            .ci-build/IoskeleyMono*.zip
            .ci-build/validation.json
            .ci-build/provenance.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - name: Preserve failed manual RC evidence
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ioskeley-failed-${{ github.sha }}
          path: |
            .ci-build/IoskeleyMono*.zip
            .ci-build/validation.json
            .ci-build/provenance.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
