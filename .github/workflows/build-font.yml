name: Build and Release Font

on:
  push:
    tags: ["v*.*.*"]
  # Manual runs validate on the runner without uploads or release creation.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Keep the runner image fixed: system tool versions are checked exactly.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read runtime versions from the shared lock
        id: toolchain
        run: |
          python3 - <<'PY'
          import json, os
          with open("tools/toolchain.lock.json") as source:
              lock = json.load(source)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"node={lock['node']}", file=output)
              print(f"python={lock['python_minor']}", file=output)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.toolchain.outputs.python }}
      - name: Install system dependencies
        timeout-minutes: 12
        shell: bash
        run: |
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              sleep 5
            done
            return 1
          }
          retry sudo apt-get update
          retry sudo apt-get install -y ttfautohint fontforge
      - name: Install pinned validation tools
        run: python -m pip install -r tools/requirements.txt
      - name: Check current site web assets
        run: python tools/validate_fonts.py site
      - name: Test validation guards
        run: python -m unittest discover -s tests -v
      - name: Build, patch, package and validate using canonical local operations
        run: python tools/build.py all --work-dir .ci-build --jobs 2
      - name: Transfer validated archives to publishing job
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: .ci-build/IoskeleyMono*.zip
          if-no-files-found: error

  # Publishing is separate from build.py and cannot run on workflow_dispatch.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: release-archives
      - name: Create tagged release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Ioskeley Mono ${{ github.ref_name }}
          body: |
            ## Ioskeley Mono ${{ github.ref_name }}

            <!-- What's new in this release -->

            ---

            ### Downloads

            **Using a terminal?** Take one of the `Term` builds. They redraw arrows
            and box-drawing to sit inside the cell, and they are the ones detected
            as monospace by fontconfig and Font Book.

            | I want it in | Download |
            |---|---|
            | An editor — VS Code, JetBrains, Zed | `IoskeleyMono.zip` |
            | An editor, with Nerd Font icons | `IoskeleyMono-NerdFont.zip` |
            | A terminal — kitty, Ghostty, WezTerm | `IoskeleyMono-Term.zip` |
            | A terminal, with Nerd Font icons | `IoskeleyMono-Term-NerdFont.zip` |
            | An app that can't turn ligatures off | `IoskeleyMono-NL.zip` |
            | Same, with Nerd Font icons | `IoskeleyMono-NL-NerdFont.zip` |
            | A website — small subset | `IoskeleyMono-Web.zip` |
            | A website — full coverage | `IoskeleyMono-Web-Full.zip` |

            `IoskeleyMono-Web.zip` is trimmed to Latin, punctuation, arrows,
            math operators and box drawing (≈94 KB per face) — the right choice
            for page loads. `IoskeleyMono-Web-Full.zip` carries the complete
            character set (Greek, Cyrillic, long arrows, rare math) at the cost
            of size, for sites that need those glyphs.

            Each desktop zip has `Hinted/` and `Unhinted/` per width — Hinted for
            standard displays, Unhinted for Retina and HiDPI.

            Nerd Font builds are now patched single-width, so they install as
            `Ioskeley Mono Nerd Font Mono`.

            Not sure which to pick? [See the README](https://github.com/ahatem/IoskeleyMono#downloads--variants).
          fail_on_unmatched_files: true
          files: release-archives/IoskeleyMono*.zip
